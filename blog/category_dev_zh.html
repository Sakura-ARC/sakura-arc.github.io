        :root {
            --bg-color: #0a0a0a;
            --text-color: #f0f0f0;
            --accent-color: #fce4ec;
            --dim-color: #888888;

        .logo-brand, .logo-site {

            gap: 1.5rem;
            font-size: 0.7rem;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .lang-switcher a {
            color: var(--dim-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        .lang-switcher a.active { color: var(--text-color); font-weight: bold; }

            border-bottom: 1px solid var(--border-color);
            transition: transform 0.3s;

            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 2.5rem;
            text-decoration: none;
            color: inherit;
            align-items: center;
        }
        .post-image {
            width: 100%;
            aspect-ratio: 1/1;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .post-item:hover .post-image img { transform: scale(1.05); }

        .post-date {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.75rem;
            color: var(--dim-color);
            margin-bottom: 0.5rem;
            display: block;

        .post-info h2 {
            font-size: 1.4rem;

            color: #fff;
            line-height: 1.4;
        }
        .post-category {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.65rem;
            color: var(--accent-color);
            text-transform: uppercase;

            font-weight: 700;
            margin-bottom: 0.5rem;
            display: block;

        .profile-icon {
            width: 60px;

            background: #1a1a1a;
            flex-shrink: 0;
            object-fit: cover;

            color: var(--dim-color);
            font-size: 0.75rem;
            font-family: 'Noto Sans JP', sans-serif;

        .footer-nav {

        .copyright {

        }
        .rss-link {

            margin-top: 3rem;
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--border-color);

            letter-spacing: 0.1rem;
